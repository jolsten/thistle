[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    # shared
    "pytest>=8",
    "pyright>=1.1.408",
    "ruff>=0.8",
    # thistle
    "cartopy>=0.23.0",
    "hypothesis>=6",
    "jupyterlab>=4.5.4",
    "matplotlib>=3.9.4",
    # thistle-db
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "requests>=2.32",
    "spacetrack>=1.4",
    "testcontainers[mysql,postgres]>=4.8,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
