[project]
name = "thistle"
description = "Satellite orbit propagation and data generation with automatic TLE switching"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jonathan Olsten", email = "jonathan.olsten@gmail.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "geographiclib>=2.0",
    "numpy>=1.22",
    "ppigrf>=2.1.0",
    "scipy>=1.13.1",
    "sgp4>=2.23",
    "skyfield>=1.53",
    # Bundles de421.bsp in its wheel, so no runtime download is ever needed
    # (replaces the 17 MB copy previously vendored in thistle itself).
    "skyfield-data>=7.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
cli = [
    "typer>=0.12; python_version >= '3.10'",
]
plot = [
    "thistle[cli]",
    # <3.13: cartopy (through 0.25) reads Formatter.locs, which Matplotlib
    # deprecated in 3.11 and removes in 3.13 — map axis rendering would
    # crash. Lift the cap once a cartopy release stops using it.
    "matplotlib>=3.8,<3.13; python_version >= '3.10'",
    "cartopy>=0.23; python_version >= '3.10'",
]
db = [
    "thistle[cli]",
    "thistle-db>=0.5.0; python_version >= '3.11'",
]

[project.scripts]
thistle = "thistle.cli:main"

[project.urls]
Source = "https://github.com/jolsten/thistle"
Issues = "https://github.com/jolsten/thistle/issues"

[tool.uv.sources]
thistle-db = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "thistle-v[0-9]*",
]
tag_regex = "^thistle-v(?P<version>.+)$"

[tool.hatch.build.hooks.vcs]
version-file = "src/thistle/_version.py"

[tool.pyright]
# Suppress type errors from third-party libraries without complete type stubs
reportAttributeAccessIssue = "none"
reportOperatorIssue = "none"
reportOptionalMemberAccess = "none"

# Only apply to third-party modules
[[tool.pyright.executionEnvironments]]
root = "."
include = ["src"]
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Per-module options for third-party libraries
[[tool.mypy.overrides]]
module = [
    "skyfield.*",
    "sgp4.*",
]
ignore_missing_imports = true
ignore_errors = true
