# thistle-db example configuration.
# `thistle-db init` scaffolds a fully commented starter config; this file
# shows a complete operational layout.

[database]
# Operational: MariaDB. Testing/serverless: SQLite.
# drivername = "mysql+pymysql"
# host = "localhost"
# port = 3306
# name = "thistle-db"
# Credentials resolved via (in priority order):
#   1. Env vars: THISTLE_DB_DATABASE__USERNAME / THISTLE_DB_DATABASE__PASSWORD
#   2. User secrets file: ~/.config/thistle-db.toml (username/password keys)
#   3. System secrets file below
# secrets_file = "/etc/thistle-db/secrets.toml"

# SQLite (for testing/development)
drivername = "sqlite"
name = "tle.db"

[ingest]
# Reject elsets whose epoch is more than this many days ahead (0 disables).
# Rejected records are retained in the `rejects` table and re-admitted
# automatically once their epoch comes inside the horizon.
max_epoch_ahead_days = 30
# Reject TLE lines whose mod-10 checksum (column 69) does not match.
verify_checksums = true
# Delta-buffer memory budget (records per flush; ~600 B each).
flush_records = 1000000

[[ingest.sources]]
path = "/data/spacetrack/daily"
pattern = "*.txt"

[[ingest.sources]]
path = "/data/spacetrack/gp"
pattern = "*.json"

# Outputs are maintained incrementally by `ingest` itself; `rebuild`
# re-derives them all from the store after a config change.

[[output.files]]
type = "object"          # one file per satellite, full history, epoch order
format = "tle"
dir = "/data/tle/objects"
# object_id = "alpha5"   # E5693.tle instead of 145693.tle
# zero_pad = true        # 00900.tle instead of 900.tle (object_id = "int")
# filename = "tle_{id}{ext}"

[[output.files]]
type = "date"            # one file per epoch date, latest record per object
format = "tle"
dir = "/data/tle/daily"
# date_format = "%Y%m%d"

[[output.files]]
type = "date"            # STK-compatible OMM CSV
format = "omm-csv"
dir = "/data/omm/daily"
# columns = "stk"        # 17-column STK projection (default), or "full"

[output]
# write_workers = 0      # 0 = auto (CPU count x 4, capped); 1 = serial

[logging]
level = "INFO"
