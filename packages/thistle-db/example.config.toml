[database]
# Operational: MariaDB. Testing: SQLite.
# drivername = "mysql+pymysql"
# host = "localhost"
# port = 3306
# name = "thistle-db"
# Credentials resolved via (in priority order):
#   1. Env vars: THISTLE_DB_DATABASE__USERNAME / THISTLE_DB_DATABASE__PASSWORD
#   2. User secrets file: ~/.config/thistle-db.toml (username/password keys)
#   3. System secrets file below
# secrets_file = "/etc/thistle-db/secrets.toml"

# SQLite (for testing/development)
drivername = "sqlite"
name = "tle.db"

# Alternative: no element-set database at all. Ingest writes the output
# files directly; the first type="object", format="tle" entry below is the
# canonical store. The [database] section is then ignored, and omm outputs
# are not supported. See CLAUDE.md "Storage backends".
# [storage]
# backend = "files"
# state = "./thistle-state.sqlite"  # ingest file-tracking cache (auto-created)
# flush_records = 1000000           # memory budget per flush

[ingest]
# Records that cannot be stored (unparseable text, elsets whose mandatory
# elements are not finite numbers, rows the database refuses) are copied
# here in their source format for inspection, mirroring the source tree:
#   /data/incoming/2006/x.tle  ->  rejects/incoming/2006/x.tle  (+ .log)
# The directory is a live view of what is currently broken — artifacts are
# overwritten each run and removed once a file ingests cleanly — so it needs
# no retention policy. Unset (the default) drops rejects after logging them.
# reject_dir = "./rejects"
# Reject elsets whose epoch is more than this many days ahead of now
# (0 disables; past epochs are never bounded). Corrupted epoch fields parse
# into 2000-2056 and would permanently degrade that object's incremental
# output. Raise for predicted-elset workflows.
# max_epoch_ahead_days = 30

[[ingest.sources]]
path = "/data/incoming"
pattern = "*.tle"

[output]
# Incremental generation tuning (see README):
# lookback_days = 7    # object files: newly created rows considered each run
#                      # (must exceed the ingest cron cadence)
# write_workers = 0    # threads for output writes; 0 = auto, 1 = serial

# One [[output.files]] entry per generated output. type: "date" | "object";
# format: "tle" | "omm". Object filenames: object_id = "int" | "alpha5",
# zero_pad = true pads int IDs to 5 digits. Date filenames: date_format
# (strftime, default "%Y%m%d"). extension overrides ".tle"/".omm".
# filename is a template arranging those pieces, default "{id}{ext}" for
# object outputs and "{date}{ext}" for date outputs; e.g. "tle_{id}.txt" or
# "{date}_gp{ext}". Placeholders: {id} or {date}, {ext}, {format}, {type}.

[[output.files]]
type = "date"
format = "tle"
dir = "./output"

[[output.files]]
type = "date"
format = "omm"
dir = "./output"

[[output.files]]
type = "object"
format = "tle"
dir = "./output"
# object_id = "alpha5"   # E5693.tle instead of 145693.tle
# zero_pad = true        # 00900.tle instead of 900.tle

[[output.files]]
type = "object"
format = "omm"
dir = "./output"

[logging]
level = "INFO"
