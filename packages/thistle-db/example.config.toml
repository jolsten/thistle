[database]
# Operational: MariaDB. Testing: SQLite.
# drivername = "mysql+pymysql"
# host = "localhost"
# port = 3306
# name = "thistle-db"
# Credentials resolved via (in priority order):
#   1. Env vars: THISTLE_DB_DATABASE__USERNAME / THISTLE_DB_DATABASE__PASSWORD
#   2. User secrets file: ~/.config/thistle-db.toml (username/password keys)
#   3. System secrets file below
# secrets_file = "/etc/thistle-db/secrets.toml"

# SQLite (for testing/development)
drivername = "sqlite"
name = "tle.db"

[[ingest.sources]]
path = "/data/incoming"
pattern = "*.tle"

[output]
# Incremental generation tuning (see README):
# window_days = 60     # date files: trailing epoch window rewritten each run
# lookback_days = 7    # object files: newly created rows considered each run
#                      # (must exceed the ingest cron cadence)

# One [[output.files]] entry per generated output. type: "date" | "object";
# format: "tle" | "omm". Object filenames: object_id = "int" | "alpha5",
# zero_pad = true pads int IDs to 5 digits. Date filenames: date_format
# (strftime, default "%Y%m%d"). extension overrides ".tle"/".omm".

[[output.files]]
type = "date"
format = "tle"
dir = "./output"

[[output.files]]
type = "date"
format = "omm"
dir = "./output"

[[output.files]]
type = "object"
format = "tle"
dir = "./output"
# object_id = "alpha5"   # E5693.tle instead of 145693.tle
# zero_pad = true        # 00900.tle instead of 900.tle

[[output.files]]
type = "object"
format = "omm"
dir = "./output"

[logging]
level = "INFO"
